version: '3'
services:
  db:
    image: postgres:14.0
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: storefront
      POSTGRES_PASSWORD: superadmin
      POSTGRES_DB: storefrontdb
    ports:
      - "5432:5432"
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "4455:4455"
    volumes:
      - .:/app
      # - /app/node_modules
    depends_on:
      - db
    restart: on-failure
 

    