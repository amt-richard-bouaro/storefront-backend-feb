version: '3'

services:
  store-backend-aug:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: store-backend-aug
    image: store-backend-aug
    ports:
      - '7006:7006'
    env_file:
      - .env
    restart: on-failure

  storefront-redis:
    image: 'bitnami/redis:latest'
    container_name: storefront-redis
    restart: unless-stopped
    tty: true
    volumes:
      - storefront-redis-data:/data
    ports:
      - '6380:6380'
    environment:
      - REDIS_PORT_NUMBER=6380
      - REDIS_USERNAME=default
      - REDIS_PASSWORD=storefront

volumes:
  storefront-redis-data:
    driver: local
